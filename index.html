<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>stream-assets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="./src/hub/hub.css" />
  </head>
  <body>
    <header class="masthead">
      <h1>stream-assets</h1>
      <p>Twitch配信用の素材置き場。OBSのブラウザソースからURLで読み込む。</p>
    </header>

    <main>
      <ul class="catalog" aria-label="素材の種類">
        <li>
          <a href="./wallpaper/">
            <span class="name">壁紙</span>
            <span class="summary">配信画面の背景。色や速さを調整してURLをコピーする。</span>
          </a>
        </li>
        <li>
          <a href="./clock/">
            <span class="name">時計</span>
            <span class="summary">配信画面に重ねる時計。表示する項目や色をURLで指定する。</span>
          </a>
        </li>
        <li>
          <a href="./chat/">
            <span class="name">チャットボックス</span>
            <span class="summary">Twitchのチャット欄を配信画面に重ねる。チャンネル名をURLで指定する。</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
