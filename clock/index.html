<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>時計 | stream-assets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="../src/core/ui/ui.css" />
    <link rel="stylesheet" href="../src/core/gallery/gallery.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="../">stream-assets</a>
      <nav aria-label="サイト内の移動">
        <a href="../wallpaper/">壁紙</a>
        <a href="../clock/" aria-current="page">時計</a>
        <a href="../chat/">チャット</a>
        <a href="../admin/">アラート</a>
      </nav>
    </header>

    <main class="workspace">
      <div class="shelf">
        <h1>時計</h1>
        <p class="lead">配信画面に重ねる時計。選んで、調整して、URLをコピーする。時刻は配信PCのローカル時刻。</p>
        <nav aria-label="時計の種類">
          <ul id="shelf"></ul>
        </nav>
      </div>

      <section class="monitor" aria-labelledby="current-title">
        <h2 id="current-title"></h2>
        <p id="current-description"></p>

        <label for="url">OBSのブラウザソースに貼るURL（サイズの例 600×240。文字や文字盤は幅と高さに収まる大きさになる）</label>
        <div class="source">
          <div class="output-row">
            <input id="url" type="text" readonly />
            <button type="button" id="copy" class="action">URLをコピー</button>
          </div>
          <div class="source-stage">
            <div class="screen" id="screen">
              <iframe id="preview" title="時計のプレビュー" width="600" height="240"></iframe>
            </div>
          </div>
        </div>
        <p id="copy-status" role="status"></p>
      </section>

      <section class="controls" aria-labelledby="controls-title">
        <h2 id="controls-title">調整</h2>
        <form id="controls"></form>
        <button type="button" id="reset" class="quiet">既定値に戻す</button>
      </section>
    </main>

    <script type="module" src="../src/clock/gallery.ts"></script>
  </body>
</html>
